services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: newradiochiwebsite26_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newradiochiwebsite26_net

  nginx:
    image: nginx:1.27-alpine
    container_name: newradiochiwebsite26_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - newradiochiwebsite26_net

  postgres:
    image: postgres:16-alpine
    container_name: newradiochiwebsite26_postgres
    environment:
      POSTGRES_DB: radiochi
      POSTGRES_USER: radiochi
      POSTGRES_PASSWORD: radiochi_secure_pass
    volumes:
      - newradiochiwebsite26_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiochi -d radiochi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newradiochiwebsite26_net

  redis:
    image: redis:7-alpine
    container_name: newradiochiwebsite26_redis
    command: redis-server --appendonly yes
    volumes:
      - newradiochiwebsite26_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newradiochiwebsite26_net

  n8n_postgres:
    image: postgres:16-alpine
    container_name: newradiochiwebsite26_n8n_postgres
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
      POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n_secure_pass}
    volumes:
      - newradiochiwebsite26_n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER:-n8n} -d ${N8N_POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newradiochiwebsite26_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: newradiochiwebsite26_n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: ${N8N_TIMEZONE:-Europe/Madrid}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Madrid}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n_secure_pass}
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${N8N_QUEUE_REDIS_DB:-2}
      QUEUE_BULL_PREFIX: ${N8N_QUEUE_REDIS_PREFIX:-newradiochi_n8n}
    volumes:
      - newradiochiwebsite26_n8n_data:/home/node/.n8n
    depends_on:
      n8n_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newradiochiwebsite26_net

  n8n_worker:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: newradiochiwebsite26_n8n_worker
    command: worker --concurrency=5
    environment:
      TZ: ${N8N_TIMEZONE:-Europe/Madrid}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Madrid}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n_secure_pass}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${N8N_QUEUE_REDIS_DB:-2}
      QUEUE_BULL_PREFIX: ${N8N_QUEUE_REDIS_PREFIX:-newradiochi_n8n}
    volumes:
      - newradiochiwebsite26_n8n_data:/home/node/.n8n
    depends_on:
      n8n_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newradiochiwebsite26_net

  ollama:
    image: ollama/ollama
    container_name: newradiochiwebsite26_ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - newradiochiwebsite26_ollama_data:/root/.ollama
    networks:
      - newradiochiwebsite26_net

volumes:
  newradiochiwebsite26_postgres_data:
  newradiochiwebsite26_redis_data:
  newradiochiwebsite26_n8n_postgres_data:
  newradiochiwebsite26_n8n_data:
  newradiochiwebsite26_ollama_data:

networks:
  newradiochiwebsite26_net:
    name: newradiochiwebsite26_net
