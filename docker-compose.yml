services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newradiochiwebsite26_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newradiochiwebsite26_net

  nginx:
    image: nginx:1.27-alpine
    container_name: newradiochiwebsite26_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - newradiochiwebsite26_net

  postgres:
    image: postgres:16-alpine
    container_name: newradiochiwebsite26_postgres
    environment:
      POSTGRES_DB: radiochi
      POSTGRES_USER: radiochi
      POSTGRES_PASSWORD: radiochi_secure_pass
    volumes:
      - newradiochiwebsite26_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiochi -d radiochi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newradiochiwebsite26_net

  redis:
    image: redis:7-alpine
    container_name: newradiochiwebsite26_redis
    command: redis-server --appendonly yes
    volumes:
      - newradiochiwebsite26_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newradiochiwebsite26_net

volumes:
  newradiochiwebsite26_postgres_data:
  newradiochiwebsite26_redis_data:

networks:
  newradiochiwebsite26_net:
    name: newradiochiwebsite26_net